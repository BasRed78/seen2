name: Exercise nudges

# Pings /api/cron/exercise-nudges every 10 minutes to send push notifications
# for exercises starting in the next 15 minutes. We use GitHub Actions instead
# of Vercel cron because Vercel's Hobby plan only allows daily schedules.
#
# Required GitHub repository secrets:
#   SEEN_BASE_URL  — e.g. https://seen2.vercel.app
#   CRON_SECRET    — same value as the Vercel env var of the same name

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: exercise-nudges
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit cron endpoint
        env:
          BASE_URL: ${{ secrets.SEEN_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$SECRET" ]; then
            echo "SEEN_BASE_URL or CRON_SECRET is not set"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $SECRET" \
            "$BASE_URL/api/cron/exercise-nudges")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
